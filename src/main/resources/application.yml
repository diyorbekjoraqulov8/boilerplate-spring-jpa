spring:
  application:
    name: project-v1

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project_v1}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  profiles:
    default: dev

server:
  port: 8081

jwt:
  public-key: classpath:keys/public.pem
  private-key: ${JWT_PRIVATE_KEY:classpath:keys/private.pem}
  issuer: project-v1
  access-token-ttl: 15m
  refresh-token-ttl: 3d
