spring:
  application:
    name: project-v1

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project_v1}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
