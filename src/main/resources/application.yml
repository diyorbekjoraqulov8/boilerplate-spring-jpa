spring:
  application:
    name: project-v1

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/project_v1}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  profiles:
    default: dev

  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 200

server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: never

jwt:
  public-key: classpath:keys/public.pem
  private-key: ${JWT_PRIVATE_KEY:classpath:keys/private.pem}
  issuer: project-v1
  access-token-ttl: 15m
  refresh-token-ttl: 3d

app:
  cookie:
    secure: true
    same-site: Strict

  login:
    max-attempts: 5
    lock-duration: 15m